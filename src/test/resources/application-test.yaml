spring:
  application:
    name: multi-currency-ledger-test

  main:
    allow-bean-definition-overriding: true

  # datasource / redis / kafka 접속 정보는 IntegrationTestSupport 의 @DynamicPropertySource 가
  # Testcontainers 로부터 주입합니다. 여기에 jdbc:tc: URL 을 또 적으면 IntegrationTestSupport 를
  # 상속하지 않는 테스트가 두 번째 Postgres 컨테이너를 띄워 빌드가 느려집니다.

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    root: info
    com.github.raonjena99: debug
