name: Architecture Documentation Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "src/main/java/**"
      - "build.gradle"
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Repository 다운로드
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 2. Java 21 환경 세팅
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 3. 실행 권한 부여
        run: chmod +x gradlew

      - name: 4. Spring Modulith 아키텍처 추출
        run: ./gradlew test --tests "*LedgerArchitectureTest*" --stacktrace

      - name: 5. PUML -> SVG 렌더링
        run: |
          mkdir -p docs/architecture/modulith

          docker run --rm --user $(id -u):$(id -g) -v ${{ github.workspace }}:/app plantuml/plantuml -tsvg "/app/build/spring-modulith-docs/*.puml"

          shopt -s nullglob
          cp build/spring-modulith-docs/*.svg docs/architecture/modulith/ || true
          cp build/spring-modulith-docs/*.puml docs/architecture/modulith/ || true

      - name: 6. 문서 업데이트 PR 자동 생성
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: 아키텍처 다이어그램 및 README 문서 자동 동기화"
          branch: "docs/auto-update-architecture"
          title: "docs: 아키텍처 다이어그램 자동 동기화"
          body: "Spring Modulith 구조 변경에 따른 아키텍처 다이어그램 및 README 파일 자동 업데이트 PR입니다."
