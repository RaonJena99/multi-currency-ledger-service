name: Architecture Documentation Pipeline

on:
  # 실패했거나 수동으로 다시 동기화해야 할 때 Actions 탭에서 직접 실행한다.
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/main/java/**"
      - "build.gradle"
      - ".github/workflows/**"

permissions:
  contents: write
  pull-requests: write

# main 에 연달아 머지되면 두 실행이 같은 문서 브랜치를 동시에 갱신하다 충돌한다. 최신 실행만 남긴다.
concurrency:
  group: architecture-docs
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Repository 다운로드
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 2. Java 21 환경 세팅
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: 3. 실행 권한 부여
        run: chmod +x gradlew

      - name: 4. Spring Modulith 아키텍처 추출
        run: ./gradlew test --tests "*LedgerArchitectureTest*" --stacktrace

      - name: 5. PUML -> SVG 렌더링
        run: |
          mkdir -p docs/architecture/modulith

          docker run --rm --user "$(id -u):$(id -g)" -v ${{ github.workspace }}:/app plantuml/plantuml -tsvg "/app/build/spring-modulith-docs/*.puml"

          shopt -s nullglob
          cp build/spring-modulith-docs/*.svg docs/architecture/modulith/ || true
          cp build/spring-modulith-docs/*.puml docs/architecture/modulith/ || true

      - name: 6. 문서 업데이트 PR 자동 생성
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: 아키텍처 다이어그램 및 README 문서 자동 동기화"
          branch: "docs/auto-update-architecture"
          title: "docs: 아키텍처 다이어그램 자동 동기화"
          body: "Spring Modulith 구조 변경에 따른 아키텍처 다이어그램 및 README 파일 자동 업데이트 PR입니다."

      # 생성된 다이어그램만 바뀐 PR 은 사람이 검토할 내용이 없으므로 바로 병합한다. GITHUB_TOKEN 으로 만든 PR 에서는
      # CI 가 돌지 않으므로(GitHub 정책) 기다릴 검사도 없다. 병합 커밋도 GITHUB_TOKEN 이 만들므로 이 워크플로를
      # 다시 실행시키지 않는다(무한 반복 없음).
      #
      # 안전장치: docs/architecture/ 밖의 파일이 섞여 있으면 병합하지 않고 PR 로 남겨 사람이 보게 한다.
      - name: 7. 문서 PR 자동 병합
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          outside=$(gh pr diff "$PR_NUMBER" --name-only | grep -v '^docs/architecture/' || true)
          if [ -n "$outside" ]; then
            echo "::warning::docs/architecture/ 밖의 변경이 있어 자동 병합하지 않습니다: $outside"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --squash --delete-branch
