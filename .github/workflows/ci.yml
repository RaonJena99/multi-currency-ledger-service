name: CI

# PR 과 main 푸시마다 두 가지를 검증한다.
#   1. test        : 전체 테스트와 커버리지 (Testcontainers 로 PostgreSQL/Redis/Kafka 를 띄운다)
#   2. image-smoke : Docker 이미지를 실제로 빌드해 운영용 스택으로 띄우고 기동·기본 API 를 확인한 뒤,
#                    고칠 수 있는 HIGH/CRITICAL 취약점이 있는지 스캔한다
# 테스트는 로컬 빌드 산출물로 돌기 때문에 "이미지로 만든 jar 가 뜨는가"는 2번만 잡을 수 있다.
on:
  pull_request:
    branches: ["main"]
  # main 에 직접 푸시된 커밋도 검증한다. PR 트리거만 두면 main 이 검증 없이 깨질 수 있다.
  push:
    branches: ["main"]
  # 코드가 그대로여도 새 취약점은 계속 공개된다. 매주 main 을 다시 검증해 실패하면 알림을 받는다.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다. main 은 커밋마다 끝까지 검증한다.
# GitHub 는 한 그룹에 대기 실행을 하나만 남기므로, main 을 브랜치 단위 그룹으로 묶으면 연달아 푸시될 때
# 중간 커밋의 실행이 취소된다. main 푸시는 커밋(SHA)마다 별도 그룹으로 둔다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run tests & coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/test/
          retention-days: 7

  # 알림 규칙과 대시보드는 운영에서 알림이 울리는 조건이다. 규칙을 고치다 표현식이 깨지거나 조건이 바뀌면
  # 알림이 조용히 사라지므로, 설정 검사와 함께 규칙 단위 테스트(alerts.test.yml)를 돌린다.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Prometheus config and alert rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/deploy/monitoring:/etc/prometheus:ro"               --entrypoint promtool prom/prometheus:v2.55.1 "$@"
          }
          promtool check config /etc/prometheus/prometheus.yml
          promtool test rules /etc/prometheus/alerts.test.yml

      - name: Validate Grafana dashboards
        run: |
          for f in deploy/monitoring/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 주간 스케줄 실행은 캐시 없이 빌드한다. 베이스 이미지가 그대로면 Dockerfile 의 apt-get upgrade 레이어가
      # 캐시에서 재사용되어, 그사이 나온 OS 보안 패치가 빠진 이미지를 스캔하게 된다(고칠 수 있는데 실패).
      # 새로 빌드한 레이어는 cache-to 로 다시 저장되므로 이후 PR 빌드도 갱신된 레이어를 쓴다.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ledger:ci
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: deploy/smoke-test.sh ledger:ci

      # 수정판이 나온 취약점만 실패로 본다(--ignore-unfixed). 수정판이 없으면 할 수 있는 조치가 없어 알림만 늘어난다.
      # 악용 불가로 판단한 항목은 .trivyignore 에 근거와 함께 적는다.
      - name: Vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.74.0 image \
            --timeout 20m --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 ledger:ci
