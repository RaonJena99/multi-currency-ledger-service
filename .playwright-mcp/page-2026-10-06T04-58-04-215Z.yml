                            - checkbox "제1조(목적)" [ref=f11e96]
                            - generic [ref=f11e97]: 제1조(목적)
                            - text: 이 법은 「해양법에 관한 국제연합협약」의 관계 규정에 따라 대한민국의 배타적 경제수역에서 이루어지는 외국인의 어업활동에 관한 우리나라의 주권적 권리의 행사 등에 필요한 사항을 규정함으로써 해양생물자원의 적정한 보존ㆍ관리 및 이용에 이바지함을 목적으로 한다.
                          - paragraph [ref=f11e98]: "[전문개정 2010. 3. 17.]"
                          - paragraph
                      - generic [ref=f11e99]:
                        - list [ref=f11e100]:
                          - listitem [ref=f11e101]:
                            - link [ref=f11e102] [cursor=pointer]:
                              - /url: "#AJAX"
                              - img "조문체계도버튼" [ref=f11e103]
                          - listitem [ref=f11e104]:
                            - link [ref=f11e105] [cursor=pointer]:
                              - /url: "#AJAX"
                              - img "연혁" [ref=f11e106]
                        - generic [ref=f11e107]:
                          - paragraph [ref=f11e108]:
                            - checkbox "제2조(정의)" [ref=f11e109]
                            - generic [ref=f11e110]: 제2조(정의)
                            - text: 이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2013. 3. 23., 2017. 3. 21.>
                          - paragraph
                          - paragraph [ref=f11e111]:
                            - text: 1. “배타적 경제수역”이란
                            - link "「배타적 경제수역 및 대륙붕에 관한 법률」" [ref=f11e112] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 에 따라 설정된 수역(水域)을 말한다.
                          - paragraph [ref=f11e113]: 2. “외국인”이란 다음 각 목의 어느 하나에 해당하는 자를 말한다.
                          - paragraph [ref=f11e114]: 가. 대한민국 국적을 가지지 아니한 사람
                          - paragraph [ref=f11e115]: 나. 외국의 법률에 따라 설립된 법인(대한민국의 법률에 따라 설립된 법인으로서 외국에 본점 또는 주된 사무소를 가진 법인이나 그 주식 또는 지분의 2분의 1 이상을 외국인이 소유하고 있는 법인을 포함한다)
                          - paragraph [ref=f11e116]: 3. “어업”이란 수산동식물(水産動植物)을 포획ㆍ채취하거나 양식하는 사업을 말한다.
                          - paragraph [ref=f11e117]:
                            - text: 4. “어업활동”이란 어업이나 어업에 관련된 탐색ㆍ집어(集魚), 어획물의 보관ㆍ저장ㆍ가공, 어획물 또는 그 제품의 운반, 선박에 필요한 물건의 보급 또는 그 밖에
                            - link "해양수산부령" [ref=f11e118] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 으로 정하는 어업에 관련된 행위를 말한다.
                          - paragraph [ref=f11e119]: "[전문개정 2010. 3. 17.]"
                          - paragraph
                      - generic [ref=f11e120]:
                        - list [ref=f11e121]:
                          - listitem [ref=f11e122]:
                            - link [ref=f11e123] [cursor=pointer]:
                              - /url: "#AJAX"
                              - img "조문체계도버튼" [ref=f11e124]
                          - listitem [ref=f11e125]:
                            - link [ref=f11e126] [cursor=pointer]:
                              - /url: "#AJAX"
                              - img "연혁" [ref=f11e127]
                        - generic [ref=f11e128]:
                          - paragraph [ref=f11e129]:
                            - checkbox "제3조(적용 범위 등)" [ref=f11e130]
                            - generic [ref=f11e131]: 제3조(적용 범위 등)
                            - text: ① 외국인이 배타적 경제수역에서 어업활동을 하는 경우에는
                            - link "「수산업법」" [ref=f11e132] [cursor=pointer]:
                              - /url: javascript:;
                            - text: ","
                            - link "「양식산업발전법」" [ref=f11e133] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 및
                            - link "「수산자원관리법」" [ref=f11e134] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 에도 불구하고 이 법을 적용한다. <개정 2019. 8. 27.>
                          - paragraph [ref=f11e135]: ② 이 법에서 규정하는 사항에 관하여 외국과의 협정에서 따로 정하는 것이 있을 때에는 그 협정에서 정하는 바에 따른다.
                          - paragraph [ref=f11e136]:
                            - text: ③ 배타적 경제수역에서 이루어지는 외국인의 어업활동에 관하여는
                            - link "「배타적 경제수역 및 대륙붕에 관한 법률」" [ref=f11e137] [cursor=pointer]:
                              - /url: javascript:;
                            - link "제5조" [ref=f11e138] [cursor=pointer]:
                              - /url: javascript:;
                            - link "제1항" [ref=f11e139] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 에도 불구하고
                            - link "대통령령" [ref=f11e140] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 으로 정하는 법령의 규정을 적용하지 아니한다. <개정 2017. 3. 21.>
                          - paragraph [ref=f11e141]: "[전문개정 2010. 3. 17.]"
