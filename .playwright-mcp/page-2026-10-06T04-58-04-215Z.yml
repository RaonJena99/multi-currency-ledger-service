                            - generic [ref=f11e191]: 제6조(허가기준)
                            - text: ① 해양수산부장관은
                            - link "제5조" [ref=f11e192] [cursor=pointer]:
                              - /url: javascript:;
                            - link "제1항" [ref=f11e193] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 에 따른 허가 신청을 받았을 때에는 다음 각 호의 기준을 모두 충족하는 경우에만 허가할 수 있다. <개정 2013. 3. 23.>
                          - paragraph [ref=f11e194]: 1. 허가 신청된 어업활동이 국제협약 또는 국가 간의 합의나 그 밖에 이에 준하는 것의 이행에 지장을 주지 아니한다고 인정될 것
                          - paragraph [ref=f11e195]:
                            - text: 2. 허가 신청된 어업활동으로 인하여
                            - link "해양수산부령" [ref=f11e196] [cursor=pointer]:
                              - /url: javascript:;
                            - text: 으로 정하는 바에 따라
                            - link "해양수산부장관이 정하는" [ref=f11e197] [cursor=pointer]:
                              - /url: "#AJAX"
