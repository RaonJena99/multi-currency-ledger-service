                        - generic [ref=f11e170]:
                          - paragraph [ref=f11e171]:
                            - checkbox "제5조(어업의 허가 등)" [ref=f11e172]
                            - generic [ref=f11e173]: 제5조(어업의 허가 등)
                            - text: ① 외국인은 특정금지구역이 아닌 배타적 경제수역에서 어업활동을 하려면 선박마다 해양수산부장관의 허가를 받아야 한다. <개정 2013. 3. 23.>
                          - paragraph [ref=f11e174]: ② 해양수산부장관은 제1항에 따라 허가를 하였을 때에는 해당 외국인에게 허가증을 발급하여야 한다. <개정 2013. 3. 23.>
                          - paragraph [ref=f11e175]: ③ 제1항에 따라 허가를 받은 외국인은 허가를 받은 선박에 허가 사항을 식별할 수 있도록 표지(標識)를 하여야 하며, 제2항의 허가증을 갖추어 두어야 한다.
                          - paragraph [ref=f11e176]:
                            - text: ④ 제1항부터 제3항까지의 규정에 따른 허가 사항은
