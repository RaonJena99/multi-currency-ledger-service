        - generic [ref=f2e152]:
          - heading "지표설명" [level=4] [ref=f2e153]
          - generic [ref=f2e154]: "■ 지표 개념- 해양경찰청 단속건수 : 불법조업을 한 외국어선을 대상으로 단속하여 사법처리 적용법조에 의한 분류■ 지표의 의의 및 활용도- 불법조업 외국어선의 단속은 해양에서 주권 행사의 일부로 국가 공권력의 증명적인 역할을 함, 따라서 타국 어선이 불법조업시 범죄행위임을 나타내는 반증이 될 수 있음■ 수치해석방법- 나포 : ‘배타적경제수역어업주권법’, ‘영해 및 접속수역법’ 위반 외국어선을 말함- 무허가 : ‘배타적경제수역어업주권법’에서 규정하고 있는 우리나라에서 허가되지 않은 외국어선을 말함- 제한조건 위반 등 : ‘배타적경제수역어업주권법’에서 규정하고 있는 조건부 허가사항을 위반한 외국어선을 말함- 영해침범 : ‘영해 및 접속수역법’ 위반 외국어선을 말함 ※ 영해: 영토에 인접한 해역으로서, 그 나라의 통치권이 미치는 범위이다. - 비고(NLL) : ‘배타적경제수역어업주권법’, ‘영해 및 접속수역법’ 위반 외국어선 중 NLL 인근에서 나포된 외국어선■ 배타적경제수역과 영해침범을 분류 한 이유- 단속현황중 배타적경제수역과 영해침범을 나눈 이유는 적용 법 조항 및 처벌 사항이 다르기 때문"
          - heading "지표해석" [level=4] [ref=f2e155]
          - generic [ref=f2e156]: "■ 수치증감 및 변동요인 분석 - 2015년 298건 > '16년 162건 감소 사유 : 해양경비안전본부로 해체된 해경업무 이관, 조업질서 회복, 단속 감소 - 2022년 나포척수는 2021년대비 24척 감소하였음 - 해양경찰청 사법처리 현황으로 최근 불법조업 외국어선에 대한 해양주권 실현의 정도를 표현하였으며, 조업질서 확립을 위한 양국간의 노력과 해양경찰청의 강력한 사법권 행사를 통하여 불법조업 외국어선의 수가 감소 추세.■ 향후 전망 또는 향후 계획 - 현재 불법조업 외국어선 사법처리 강화 및 국제법을 반영한 국내법 개정 · 벌칙조항(벌금) 상향 등 부단한 노력으로 불법조업 외국어선이 감소 추세에 있는 상황이며, 지속 감소 할 것으로 전망."
          - heading "유의사항" [level=4] [ref=f2e157]
          - text: o 본 통계는 해양경찰청 단속 실적(해양수산부 어업관리단 실적 제외) 통계 임.
      - generic [ref=f2e158]:
        - generic [ref=f2e159]:
