        - generic [ref=f2e166]:
          - paragraph [ref=f2e167]:
            - strong [ref=f2e168]: "중국어선 단속현황 :"
            - text: EEZ어업법을 위반한 불법조업 중국어선을 단속하여 사법처리한 것으로 단속해역에 따라 EEZ해역과 NLL해역으로 구분함
          - paragraph [ref=f2e169]:
            - strong [ref=f2e170]: "EEZ(exclusive economic zone) 배타적 경제수역 :"
            - text: 자국 연안으로부터 200해리까지의 모든 자원에 대해 독점적 권리를 행사할 수 있는 유엔 국제해양법상의 수역으로 타국 어선이 EEZ 안에서 조업을 하기 위해서는 연안국의 허가를 받아야 하며 이를 위반했을 때는 단속, 나포되어 처벌을 받는다
          - paragraph [ref=f2e171]:
            - strong [ref=f2e172]: "NLL(northen limit line) 북방한계선 :"
            - text: 1953년 정전직 후, 클라크 주한 유엔군사령관이 북한과 협의없이 일방적으로 설정한 해상 경계선
          - paragraph [ref=f2e173]:
            - strong [ref=f2e174]: "한중 과도수역 :"
            - text: 한중어업협정에 따라 협정 발효일인 2001년 6월 30일부터 4년이 지나면 자동적으로 연안국의 배타적 경제수역(EEZ)으로 귀속되는 수역* 관련파일 참조(그림)
          - paragraph [ref=f2e175]:
            - strong [ref=f2e176]: "영해 :"
            - text: 영토에 인접한 해역으로서, 그 나라의 통치권이 미치는 범위이다. 연안해, 내해(內海), 만(灣), 해협 등으로 이루어지는데, 영해 설정의 기준이 되는 기선(基線)을 기준으로 폭 12해리(22.224km)가 일반적이다.당연하겠지만, '해안선'이 없는 내륙국은 영해가 없다
