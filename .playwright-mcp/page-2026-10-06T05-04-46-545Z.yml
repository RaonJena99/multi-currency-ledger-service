                            - generic [ref=f31e177]: 최근 8년간(2016년~2024년) 불법조업 외국어선(중국어선)의 월별 나포(검거) 현황 입니다.불법조업 외국어선 나포는 해양경찰이 우리 해역에서 허가 없이 조업하거나 허가 내용을 위반하는 외국어선을 적발하여 억류하는 행위를 의미합니다. 이러한 나포 행위는 해양경찰청, 각 해양경찰서, 해군, 해양수산부 등 정부 기관들이 합동으로 특별 단속을 실시하면서 이루어지며, 특히 제주 해역이나 연평도 해상 등에서 빈번하게 발생합니다. 나포 대상 행위무허가 조업:우리 EEZ(배타적경제수역)나 영해 내에서 허가를 받지 않고 조업하는 행위. 조업 일지 허위 기재:조업 일지를 허위로 작성하여 불법 조업 사실을 은폐하려는 행위. 기타 위반 행위:단속 과정에서의 저항 등 불법 조업에 해당되는 다양한 위반 행위.
