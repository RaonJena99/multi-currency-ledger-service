              - generic [ref=f20e71]:
                - paragraph [ref=f20e72]:
                  - strong [ref=f20e73]: 협정 이행 감시 및 보고
                  - text: 해양수산부에서는 본 데이터를 활용하여 중국 어선의 한국 EEZ 내 어업 활동이 협정 조건에 부합하는지 실시간으로 점검합니다. 기준년도와 확정여부, 확정일자를 기준으로 이행 현황을 정리하고, 필요 시 관계 부처에 보고서를 제출합니다. 이를 통해 정책 담당자는 신속히 위반 사례를 파악하고 적절한 조치를 취할 수 있습니다.
                - paragraph [ref=f20e74]:
                  - strong [ref=f20e75]: 할당량 변동 분석 및 정책 수립
                  - text: 총할당량과 EEZ어종코드 정보를 통해 어종별 할당량 변동 추이를 분석합니다. 변동 폭이 큰 경우, 향후 협정 조정이나 추가 할당량 협의를 위한 근거 자료로 활용됩니다. 정책 담당자는 이러한 분석 결과를 바탕으로 보다 효율적인 어업 관리 방안을 마련합니다.
                - paragraph [ref=f20e76]:
                  - strong [ref=f20e77]: 연도별 어업활동 추이와 경제효과 평가
                  - text: 업종일련번호와 어업종류코드를 이용해 연도별 어업 활동 규모를 파악하고, 경제적 파급 효과를 정량화합니다. 데이터기준일자를 기준으로 최신 정보를 반영함으로써, 정책 입안 시 최신 상황을 정확히 반영할 수 있습니다. 이를 통해 한국 수역의 지속 가능한 이용 방안을 도출합니다.
                - paragraph [ref=f20e78]:
                  - strong [ref=f20e79]: 해양수산·어촌 체계와의 연계 및 문서화
                  - text: "하위체계인 해양수산·어촌과 연계하여 협정 상세 정보를 체계적으로 문서화합니다. 관리부서인 해양수산부는 키워드(예: 배타적경제수역, 협정상세)를 활용해 검색 및 보고 체계를 강화합니다. 결과적으로 관련 부처와의 협업이 원활해지고, 정책 실행의 투명성이 확보됩니다."
