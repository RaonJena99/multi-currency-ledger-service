              - generic [ref=f19e71]:
                - paragraph [ref=f19e72]: 데이터 기반 정책 모니터링해양수산부에서 제공하는 이 데이터는 중국 어선의 한국 EEZ 내 어업 활동을 연도별·종류별로 상세히 기록하고 있습니다. 이를 통해 정책 담당자는 어업 협정 이행 여부를 실시간으로 점검할 수 있으며, 미이행 사례에 대한 신속한 대응이 가능합니다. 또한, 확정여부와 확정일자를 활용해 정책 집행의 투명성을 높일 수 있습니다.
                - paragraph [ref=f19e73]: 연간 할당량 관리와 조업수역 최적화총할당량(톤)과 합의척수 정보를 바탕으로 연간 어획량을 정확히 관리함으로써 과잉 어획을 방지할 수 있습니다. 조업수역코드와 사용어구코드를 연계하면 특정 수역·어구별 효율성을 분석하여 최적의 조업 전략을 수립할 수 있습니다. 이러한 관리 체계는 양국 간 협정 이행 신뢰도를 강화하는 데 기여합니다.
                - paragraph [ref=f19e74]: 어업통계 연구 및 학술 활용업종코드와 업종명, 영문·한자명을 포함한 상세 분류는 학계와 연구기관이 어업 구조 변화를 정량적으로 분석하는 데 유용합니다. 최초생성시점·최종변경시점을 통해 데이터의 최신성을 확인하고, 장기 추세 분석에 활용할 수 있습니다. 이를 통해 어종별·수역별 자원 관리 방안을 과학적으로 제시할 수 있습니다.
                - paragraph [ref=f19e75]: 국제 협력 및 분쟁 예방데이터의 객관적 근거는 한중 어업 협상 시 협정 내용의 정확한 이해를 돕고, 의견 차이를 최소화하는 데 활용됩니다. 조업수역·어구·할당량 정보를 투명하게 공유함으로써 양국 간 신뢰를 구축하고, 잠재적 분쟁을 사전에 예방할 수 있습니다. 또한, 데이터기준일자를 기준으로 정기적인 검토 회의를 진행하면 협정 이행 상황을 지속적으로 점검할 수 있습니다.
