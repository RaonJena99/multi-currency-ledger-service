              - generic [ref=f27e762]:
                - paragraph [ref=f27e763]: "Your plan includes overuse protection: when your monthly credit allocation is exhausted, further requests are automatically blocked until the next billing cycle resets your balance. You will never be billed for overages; the cap is hard."
                - paragraph [ref=f27e764]: If you find yourself hitting the limit regularly, upgrading to the next tier or Developer Pro (unlimited) is straightforward from your account dashboard.
