                - heading "What if my request returns an error? Are credits still deducted?" [level=3] [ref=f27e754]
              - paragraph [ref=f27e757]: No. Only successful calls that return data are charged. Errors, not-found responses, and rate-limit blocks do not deduct credits from your monthly allocation.
            - generic [ref=f27e758]:
              - button "What happens when I reach my credit limit?" [ref=f27e759] [cursor=pointer]:
