              - button "What are credits?" [ref=f27e710] [cursor=pointer]:
                - heading "What are credits?" [level=3] [ref=f27e711]
              - generic [ref=f27e713]:
                - paragraph [ref=f27e714]: Credits are the unit of consumption for API calls. Each successful request to a Datalastic endpoint deducts a number of credits from your monthly allocation.
                - paragraph [ref=f27e715]: "The cost per call depends on the endpoint: a basic vessel position lookup costs 1 credit; a Pro vessel query (with ETA, ATD, and LOCODE) costs 3 credits; bulk and historical requests scale with the number of vessels or days requested. Failed or empty responses are never charged."
                - paragraph [ref=f27e716]:
                  - text: Credits reset at the start of every billing cycle. See the full breakdown in the
                  - link "API reference" [ref=f27e717] [cursor=pointer]:
                    - /url: https://docs.datalastic.com/#credit-system
                  - text: .
            - generic [ref=f27e718]:
              - button "What is the difference between Data Feed and All Data?" [ref=f27e719] [cursor=pointer]:
                - heading "What is the difference between Data Feed and All Data?" [level=3] [ref=f27e720]
              - generic [ref=f27e722]:
                - paragraph [ref=f27e723]:
                  - strong [ref=f27e724]: Data Feed
                  - text: covers live AIS tracking, historical vessel positions, vessel specs, and port information. These are the core endpoints available on every plan; the only difference between Starter, Growth, and Developer Pro is the monthly credit volume.
                - paragraph [ref=f27e725]:
                  - strong [ref=f27e726]: All Data
                  - text: "adds the complete maritime intelligence bundle: SAT-E satellite estimator, sea routes, dry dock dates, casualties, inspections & detentions, sales & demolitions, vessel ownership, classification society, vessel engines, and maritime companies. These datasets are unlocked as a single bundle, and there is no per-add-on pricing."
                - paragraph [ref=f27e727]: Both scopes use the same API key and the same endpoint structure.
            - generic [ref=f27e728]:
              - button "Can I connect Datalastic to Claude, ChatGPT, or other AI agents?" [ref=f27e729] [cursor=pointer]:
                - heading "Can I connect Datalastic to Claude, ChatGPT, or other AI agents?" [level=3] [ref=f27e730]
              - generic [ref=f27e732]:
                - paragraph [ref=f27e733]: Every plan includes access to our hosted MCP (Model Context Protocol) server, making it easy to connect Datalastic to Claude, ChatGPT, or any other MCP-compatible AI agent.
                - paragraph [ref=f27e734]: Authentication is handled automatically, so there's no need to copy and paste API keys or write any integration code. Once connected, your AI agent has access to all of the data available under your subscription plan.
                - paragraph [ref=f27e735]:
                  - text: For setup instructions and a list of supported clients, visit
                  - link "datalastic.com/mcp" [ref=f27e736] [cursor=pointer]:
                    - /url: https://datalastic.com/mcp
                  - text: .
            - generic [ref=f27e737]:
              - button "What is the difference between Starter, Growth, and Developer Pro?" [ref=f27e738] [cursor=pointer]:
                - heading "What is the difference between Starter, Growth, and Developer Pro?" [level=3] [ref=f27e739]
              - generic [ref=f27e741]:
                - paragraph [ref=f27e742]: "Only the monthly credit allocation differs: Starter gives you 20,000 credits, Growth gives you 80,000, and Developer Pro gives you unlimited credits. All three plans include exactly the same Data Feed endpoints and, if on an All Data plan, the same add-on datasets."
                - paragraph [ref=f27e743]:
                  - text: Use the
