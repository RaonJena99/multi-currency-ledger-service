# 부하 테스트용 덮어쓰기. 운영 스택(deploy/docker-compose.yml)에 이 파일을 겹쳐 띄운다.
#
#   docker compose -f deploy/docker-compose.yml -f loadtest/compose.loadtest.yml -p ledger-loadtest up -d --wait
#
# dev 프로필은 외부 시세 API 대신 더미 시세(1 BTC = 100,000,000 KRW)를 쓴다. 실제 시세 API 를 부하 테스트로
# 두드리면 요청 한도에 걸리고 결과가 외부 응답 시간에 좌우된다. local 프로필은 SQL·바인딩 로그를 켜서
# 측정을 왜곡하므로 쓰지 않는다.
services:
  app:
    environment:
      SPRING_PROFILES_ACTIVE: dev
