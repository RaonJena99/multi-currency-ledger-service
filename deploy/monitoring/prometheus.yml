# 운영 스택용 Prometheus 설정. deploy/docker-compose.yml 이 마운트한다.
#
# 앱의 관리용 엔드포인트는 관리 포트(9091)에서만 응답하고, 이 포트는 호스트에 노출되지 않는다.
# 그래서 Prometheus 는 같은 compose 네트워크 안에서 서비스 이름(app)으로 수집한다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알림 규칙(로컬 스택과 공용). 알림 전달(Alertmanager → 메일·슬랙)은 받을 채널을 정한 뒤 추가한다.
# 그전까지는 Prometheus 화면의 Alerts 탭과 Grafana 에서 확인한다.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "ledger"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["app:9091"]
