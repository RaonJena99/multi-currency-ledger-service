# prometheus/prometheus.yml
global:
  scrape_interval: 15s # 15초마다 메트릭 수집

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "multi-currency-ledger-service"
    metrics_path: "/actuator/prometheus"
    # 관리용 엔드포인트는 앱 포트(8080)가 아니라 관리 포트(MANAGEMENT_PORT, 기본 9091)에서만 응답한다.
    # 관리 포트는 내부 네트워크 전용이라는 전제로 /actuator/prometheus 를 인증 없이 수집한다.
    static_configs:
      - targets: ["host.docker.internal:9091"]
