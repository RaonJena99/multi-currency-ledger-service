# prometheus/prometheus.yml
global:
  scrape_interval: 15s # 15초마다 메트릭 수집

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "multi-currency-ledger-service"
    metrics_path: "/actuator/prometheus"
    # /actuator/prometheus 는 SecurityConfig 에서 공개(permitAll) 경로라 인증 헤더 없이 수집된다.
    # 나머지 /actuator/** 는 ROLE_ADMIN 이 필요하다. 이 경로를 보호 대상으로 바꾸면 스크랩 요청에
    # 인증 헤더(게이트웨이 시크릿 포함)를 실어야 한다. (http_headers 는 Prometheus v2.55+)
    static_configs:
      - targets: ["host.docker.internal:8080"]
